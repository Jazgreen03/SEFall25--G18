services:
  # === MongoDB Database ===
  db:
    image: mongo:7
    container_name: mongo-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    networks:
      - appnet

  # === Django Backend ===
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: django-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    links:
      - db
    depends_on:
      - db
    networks:
      - appnet
    command: >
      sh -c "python manage.py migrate &&
          python manage.py create_default_users &&
          python manage.py runserver 0.0.0.0:8000"

  # === Angular Frontend (Production via Nginx) ===
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: angular-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - appnet

  # === Angular Frontend (Development Mode with Hot Reload) ===
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: angular-dev
    volumes:
      - ./frontend/web:/app              # Mount local source for live reload
      - ./frontend/proxy.conf.json:/app/proxy.conf.json:ro
      - /app/node_modules                # Avoid overwriting node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true         # Required for file change detection inside Docker
    command: npm run start -- --host 0.0.0.0 --port 4200 --poll=1000 --proxy-config /app/proxy.conf.json
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - appnet

  # === Optional Frontend Test Runner ===
  frontend-test:
    build:
      context: .
      dockerfile: frontend/test.Dockerfile
    container_name: frontend-test
    depends_on:
      - backend
    networks:
      - appnet

# === Shared Docker Network ===
networks:
  appnet:

# === Persistent Mongo Volume ===
volumes:
  mongo_data:
