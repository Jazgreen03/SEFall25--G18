# Nginx serves Angular build at / and proxies /api to Django
server {
    listen 80;
    server_name localhost;

    # Serve Angular build output
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes (SPA fallback)
    location / {
        # Try to serve static files first, then fallback to Angular router
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to Django backend container
    location /api/ {
        # Use a variable so nginx resolves at request time
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: caching for static assets (CSS, JS, fonts, etc.)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Optional: deny access to hidden files like .env
    location ~ /\. {
        deny all;
    }
}
