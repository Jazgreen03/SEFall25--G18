<div class="account-container">
  <!-- Header -->
  <header class="account-header">
    <!-- Logo / Home -->
    <div class="logo">
      <h1
        tabindex="0"
        (click)="goToHome()"
        (keyup.enter)="goToHome()"
        (keyup.space)="goToHome()"
        style="cursor: pointer"
      >
        SecondServe
      </h1>
    </div>

    <div class="nav-buttons">
      <!-- Account button is active since we're on this page -->
      <button class="nav-btn active" (click)="goToAccount()">Account</button>
      <button class="nav-btn" (click)="goToDeliveries()">Available Deliveries</button>
      <button class="nav-btn" (click)="goToOrders()">Order History</button>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <!-- Account Card -->
  <div class="account-card">
    <h2>Account Management</h2>

    <form (ngSubmit)="updateAccount()" class="account-form">
      <!-- Email (read-only) -->
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="user.email" name="email" required />
      </div>

      <!-- Name -->
      <div class="form-group">
        <label for="first-name">Update Full Name</label>
        <input id="first-name" type="text" [(ngModel)]="user.first_name" name="first_name" required />
      </div>

      <!-- Password -->
      <div class="form-group password-input-wrapper">
        <label for="new-password">New Password</label>
        <input
          id="new-password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="user.password"
          name="password"
        />
        <button type="button" class="toggle-password" (click)="togglePassword()">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      <button type="submit" class="submit-btn">Update Account</button>
    </form>

    <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
  </div>
</div>
