<div class="deliveries-container">
  <!-- Header -->
  <header class="main-header">
    <div class="logo">
      <h1 tabindex="0" (click)="goToHome()" (keyup.enter)="goToHome()" (keyup.space)="goToHome()">
        SecondServe
      </h1>
    </div>

    <div class="nav-actions">
      <button class="nav-btn" (click)="goToHome()">Home</button>
      <button class="nav-btn" (click)="goToAccount()">Account Management</button>
      <button class="nav-btn active" (click)="goToDeliveries()">Routes</button>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <h2>Available Routes to Use</h2>
    <p class="tagline">Find out your route for your deliveries</p>

  </section>

  <section class="map-section">
  <h2>Available Routes</h2>
  <div class="map-container" style="position: relative;">
    <img src="https://i.pinimg.com/originals/55/33/51/553351425827ec1e8ed662373e7f94ea.png" 
         alt="Map of the United States" 
         class="map-image">

    <!-- Example route markers -->
    <div class="route-marker" style="top: 25%; left: 35%;">📍</div>
    <div class="route-marker" style="top: 50%; left: 60%;">📍</div>
    <div class="route-marker" style="top: 70%; left: 40%;">📍</div>
  </div>
</section>

  <!-- Delivery Grid -->
  <section *ngIf="deliveries.length > 0" class="delivery-grid">
    <div *ngFor="let delivery of deliveries" class="delivery-card">
      <div class="restaurant-info">
        <h3>{{ delivery.restaurantName }}</h3>
        <p class="address">Pickup: {{ delivery.pickupAddress }}</p>
        <p class="address">Delivery: {{ delivery.deliveryAddress }}</p>
        <p class="expiry">Requested Time: {{ delivery.requestedTime | date:'short' }}</p>
        <div class="food-types">
          <span *ngFor="let item of delivery.items" class="food-tag">{{ item }}</span>
        </div>
        <div class="actions">
          <button (click)="acceptDelivery(delivery)" class="btn-pickup">Accept Delivery</button>
        </div>
      </div>
    </div>
  </section>
</div>
