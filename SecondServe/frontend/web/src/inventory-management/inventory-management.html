<div class="inventory-container">
  <!-- Header -->
  <header class="inventory-header">
    <div class="logo">
      <h1
        tabindex="0"
        (click)="goToHome()"
        (keyup.enter)="goToHome()"
        (keyup.space)="goToHome()"
        style="cursor: pointer"
      >
        SecondServe
      </h1>
    </div>

    <div class="nav-buttons">
      <button class="nav-btn" (click)="goToAccount()">Account</button>
      <button class="nav-btn active" (click)="goToInventory()">Manage Inventory</button>
      <button class="nav-btn" (click)="goToOrders()">Order History</button>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <!-- Inventory Section -->
  <section *ngIf="!loading" class="section">
    <h3 class="section-title">📦 Inventory Awaiting Donation</h3>

    <div *ngIf="inventory.length > 0; else noInventory" class="card-grid">
      <div *ngFor="let item of inventory" class="card">
        <div class="card-header">
          <h4>{{ item.name }}</h4>
          <span class="status" [class.donated]="item.donated">
            {{ item.donated ? 'Donated' : 'Not Donated' }}
          </span>
        </div>
        <p><strong>Quantity:</strong> {{ item.quantity }}</p>
        <p>
          <strong>Expires:</strong> {{ item.expiryDate ? (item.expiryDate | date:'shortDate') : 'N/A' }}
        </p>
        <div class="actions">
          <button
            (click)="donateItem(item)"
            class="btn-primary"
            [disabled]="item.quantity <= 0 || item.donated"
            [style.opacity]="item.quantity <= 0 || item.donated ? 0.5 : 1"
          >
            Mark for Donation
          </button>
        </div>
      </div>
    </div>

    <ng-template #noInventory>
      <p class="no-results">All inventory has been donated — great job!</p>
    </ng-template>
  </section>

  <!-- Loading -->
  <section *ngIf="loading" class="loading">
    <p>Loading inventory...</p>
  </section>
</div>
