
<header>
  <div class="logo">SECOND SERVE</div>
</header>

<section class="hero-section">
  <h1>Make a Donation</h1>
  <p>
    Your contribution helps us redirect surplus food to families in need. Together, we can reduce waste and nourish communities.
  </p>
</section>

<section class="donate-form">
  <h2>Donate Now</h2>
  <form>
    <!-- Name & Email -->
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your Name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Your Email">

    <label for="company">Donor</label>
    <select id="company">
      <option value="" disabled selected>Select Donor Type</option>
      <option value="restaurant">Restaurant</option>
      <option value="grocery">Grocery Store</option>
      <option value="self">Self</option>
    </select>

    <label for="donation-type">Donation Type</label>
    <select id="donation-type">
      <option value="" disabled selected>Select Donation Type</option>
      <option value="amount">Amount</option>
      <option value="food">Food</option>
    </select>

    <div id="amount-input" style="display:none;">
      <label for="donation-amount">Donation Amount</label>
      <input type="number" id="donation-amount" placeholder="$50">
    </div>

    <div id="food-input" style="display:none;">
      <label for="food-details">Food Details</label>
      <input type="text" id="food-details" placeholder="e.g., 10 lbs of rice">
    </div>

    <button type="submit">Donate</button>
  </form>
</section>

<script>
  const donationSelect = document.getElementById("donation-type");
  const amountInput = document.getElementById("amount-input");
  const foodInput = document.getElementById("food-input");

  donationSelect.addEventListener("change", function() {
    if (this.value === "amount") {
      amountInput.style.display = "block";
      foodInput.style.display = "none";
    } else if (this.value === "food") {
      amountInput.style.display = "none";
      foodInput.style.display = "block";
    } else {
      amountInput.style.display = "none";
      foodInput.style.display = "none";
    }
  });
</script>


<footer>
  <p>© 2025 Second Serve — All Rights Reserved.</p>
</footer>
