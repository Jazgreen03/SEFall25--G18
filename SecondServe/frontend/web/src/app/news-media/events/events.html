<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecondServe | Events</title>

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />

  <!-- Your CSS -->
  <link rel="stylesheet" href="events.css" />
</head>

<body>

  <!-- ---------------- Header ---------------- -->
  <header>
    <div class="logo">
      <h1 tabindex="0" (click)="goToHome()" (keyup.enter)="goToHome()" (keyup.space)="goToHome()"
        style="cursor: pointer">
        SecondServe
      </h1>
    </div>
    <nav>
      <div class="nav-left">
        <div class="dropdown">
          <a href="#">Resources</a>
          <div class="dropdown-content">
            <a href="/donate">Donate</a>
            <a href="/restaurants">Restaurants</a>
            <a href="/community">Community Centers</a>
          </div>
        </div>

        <div class="dropdown">
          <a href="#">Media & About</a>
          <div class="dropdown-content">
            <a href="/events">Events</a>
            <a href="/blog">Blog</a>
            <a href="/mission">Mission</a>
            <a href="/contact">Contact</a>
          </div>
        </div>
      </div>

      <div class="nav-right">
        <a href="/login" class="login-btn">Login</a>
      </div>
    </nav>
  </header>


  <!-- ---------------- Hero Section ---------------- -->
  <section class="hero-section">
    <h1>Events & Activities</h1>
    <p>Explore upcoming events, community drives, and volunteering activities near you.</p>
  </section>

  <!-- ---------------- Events Page Content ---------------- -->
  <section id="events-page">

    <!-- Monthly Calendar -->
    <div class="calendar-section">
      <h2>Monthly Calendar</h2>
      <div id="monthly-calendar"></div>
    </div>

    <!-- Weekly Schedule -->
    <div class="weekly-section">
      <h2>This Week’s Schedule</h2>
      <div id="weekly-events">
        <!-- JS will dynamically populate events here -->
      </div>
    </div>
  </section>

  <!-- ---------------- FullCalendar Script ---------------- -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // --- Events Data (you can later pull from DB or API)
      const eventsData = [
        { title: "Food Drive - Dallas", date: "2025-11-03" },
        { title: "Volunteer Orientation", date: "2025-11-05" },
        { title: "Community Garden Event", date: "2025-11-06" },
        { title: "Thanksgiving Meal Prep", date: "2025-11-09" },
        { title: "Holiday Food Distribution", date: "2025-11-25" },
      ];

      // --- Monthly Calendar ---
      const calendarEl = document.getElementById("monthly-calendar");
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: eventsData,
      });
      calendar.render();

      // --- Weekly Events List ---
      const weeklyContainer = document.getElementById("weekly-events");
      const today = new Date();
      const startOfWeek = new Date(today);
      startOfWeek.setDate(today.getDate() - today.getDay()); // Sunday

      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6); // Saturday

      const weekEvents = eventsData.filter(event => {
        const eventDate = new Date(event.date);
        return eventDate >= startOfWeek && eventDate <= endOfWeek;
      });

      if (weekEvents.length === 0) {
        weeklyContainer.innerHTML = `<p>No events scheduled for this week.</p>`;
      } else {
        weeklyContainer.innerHTML = weekEvents.map(ev => `
          <div class="event-card">
            <h3>${ev.title}</h3>
            <p>${new Date(ev.date).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</p>
          </div>
        `).join("");
      }
    });
  </script>
</body>

</html>
