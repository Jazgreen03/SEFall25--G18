<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Restaurants | SecondServe</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Your CSS -->
  <link rel="stylesheet" href="restaurants.css">
</head>

<body>
  <!-- ---------------- Header ---------------- -->
  <header>
    <div class="logo">
      <h1 tabindex="0" (click)="goToHome()" (keyup.enter)="goToHome()" (keyup.space)="goToHome()"
        style="cursor: pointer">
        SecondServe
      </h1>
    </div>
    <nav>
      <div class="nav-left">
        <div class="dropdown">
          <a href="#">Resources</a>
          <div class="dropdown-content">
            <a href="/donate">Donate</a>
            <a href="/restaurants">Restaurants</a>
            <a href="/community">Community Centers</a>
          </div>
        </div>

        <div class="dropdown">
          <a href="#">Media & About</a>
          <div class="dropdown-content">
            <a href="/events">Events</a>
            <a href="/blog">Blog</a>
            <a href="/mission">Mission</a>
            <a href="/contact">Contact</a>
          </div>
        </div>
      </div>

      <div class="nav-right">
        <a href="/login" class="login-btn">Login</a>
      </div>
    </nav>
  </header>

  <!-- ---------------- Sponsor Map Section ---------------- -->
  <section id="sponsor-map-section">
    <h2>Find Restaurants / Grocery Stores Supporting SecondServe</h2>
    <p>Hover over locations to see availability.</p>
    <div id="sponsor-map"></div>
  </section>

  <!-- ---------------- Footer ---------------- -->
  <footer>
    <p>© 2025 SecondServe | Connecting surplus food to those in need.</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Initialize map
      const map = L.map('sponsor-map').setView([39.8283, -98.5795], 4);

      // Add OpenStreetMap layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Example sponsor locations
      const sponsors = [
        { name: "Joe's Deli", type: "Restaurant", coords: [40.7128, -74.0060], availability: "Yes" },
        { name: "FreshMart", type: "Grocery Store", coords: [34.0522, -118.2437], availability: "Limited" },
        { name: "Tasty Eats", type: "Restaurant", coords: [41.8781, -87.6298], availability: "Yes" }
      ];

      // Add markers
      sponsors.forEach(sponsor => {
        const marker = L.marker(sponsor.coords).addTo(map);
        marker.bindPopup(`<b>${sponsor.name}</b><br>${sponsor.type}<br>Availability: ${sponsor.availability}`);
        marker.on('mouseover', function () { this.openPopup(); });
        marker.on('mouseout', function () { this.closePopup(); });
      });
    });
  </script>
</body>

</html>
